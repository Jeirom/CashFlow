{% extends 'base.html' %}

{% block title %}Форма статуса{% endblock %}

{% block content %}
<h2 style="text-align: center; margin-bottom: 20px;">{% if status %}Редактировать статус{% else %}Добавить статус{% endif %}</h2>

<div class="form-container">
    <form method="post" class="styled-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn-primary">Сохранить</button>
            <a href="{% url 'cashflow:manage' %}" class="btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
