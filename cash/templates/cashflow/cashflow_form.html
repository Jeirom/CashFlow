{% extends 'base.html' %}

{% block title %}Форма транзакции{% endblock %}

{% block content %}

<div class="form-container">
    <form method="post" class="styled-form">
        {% csrf_token %}

        <!-- Поле даты -->
        <div class="form-group">
            <label for="{{ form.date_created.id_for_label }}">Дата операции</label>
            {{ form.date_created }}
        </div>

        <!-- Статус -->
        <div class="form-group">
            <label for="{{ form.status.id_for_label }}">Статус</label>
            {{ form.status }}
        </div>

        <!-- Тип -->
        <div class="form-group">
            <label for="{{ form.type.id_for_label }}">Тип</label>
            {{ form.type }}
        </div>

        <!-- Категория -->
        <div class="form-group">
            <label for="id_category">Категория</label>
            <select id="id_category" name="category">
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if form.category.value|stringformat:"s" == category.id|stringformat:"s" %}selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Подкатегория -->
        <div class="form-group">
            <label for="id_subcategory">Подкатегория</label>
            <select id="id_subcategory" name="subcategory">
                <!-- Опции будут динамически заполняться -->
            </select>
        </div>

        <!-- Сумма -->
        <div class="form-group">
            <label for="{{ form.amount.id_for_label }}">Сумма (₽)</label>
            {{ form.amount }}
        </div>

        <!-- Комментарий -->
        <div class="form-group">
            <label for="{{ form.comment.id_for_label }}">Комментарий</label>
            {{ form.comment }}
        </div>

        <!-- Кнопки -->
        <div class="form-actions">
            <button type="submit" class="btn-primary">Сохранить</button>
            <a href="{% url 'cashflow:list' %}" class="btn-secondary">Отмена</a>
        </div>
    </form>
</div>

<!-- Внутренние стили для аккуратного отображения -->
<style>
/* Общий контейнер формы */
.form-container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    background-color: #f8f9fa;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

/* Стиль формы с вертикальной раскладкой */
.styled-form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* Группы полей для выравнивания */
.form-group {
    display: flex;
    flex-direction: column;
}

/* Метки и поля */
.form-group label {
    font-weight: 600;
    margin-bottom: 5px;
    width: 150px;
}

/* Поля ввода и селекты */
.styled-form input[type="text"],
.styled-form input[type="number"],
.styled-form input[type="date"],
.styled-form select,
.styled-form textarea {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    width: 100%;
    box-sizing: border-box;
    transition: border-color 0.2s;
}

/* Фокус */
.styled-form input[type="text"]:focus,
.styled-form input[type="number"]:focus,
.styled-form input[type="date"]:focus,
.styled-form select:focus,
.styled-form textarea:focus {
    border-color: #007bff;
    outline: none;
}

/* Размер комментария */
.styled-form textarea[name="comment"] {
    height: 80px;
    resize: vertical;
}

/* Кнопки */
.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

/* Основная кнопка */
.btn-primary {
    padding: 10px 20px;
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.3s;
}
.btn-primary:hover {
    background-color: #0069d9;
}

/* Вторая кнопка */
.btn-secondary {
    padding: 10px 20px;
    background-color: #6c757d;
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
    transition: background-color 0.3s;
}
.btn-secondary:hover {
    background-color: #5a6268;
}
</style>

<!-- Скрипт для динамической подкатегории -->
<script>

  const subcategoriesData = {{ subcategories_json|safe }};

  function updateSubcategories() {
    const categorySelect = document.getElementById("id_category");
    const subcategorySelect = document.getElementById("id_subcategory");
    const selectedCategoryId = parseInt(categorySelect.value);

    subcategorySelect.innerHTML = "";

    const filteredSubcategories = subcategoriesData.filter(
      subcat => subcat.category_id === selectedCategoryId
    );

    filteredSubcategories.forEach(obj => {
      const opt = document.createElement("option");
      opt.value = obj.id;
      opt.textContent = obj.name;

      {% if form.subcategory.value %}
        if (obj.id == "{{ form.subcategory.value }}") {
          opt.selected = true;
        }
      {% endif %}

      subcategorySelect.appendChild(opt);
    });
  }

  document.getElementById("id_category").addEventListener("change", updateSubcategories);

  document.addEventListener("DOMContentLoaded", () => {
    updateSubcategories();
  });
</script>
{% endblock %}
