{% extends 'base.html' %}

{% block title %}Удаление транзакции{% endblock %}

{% block content %}
<h2>Вы уверены, что хотите удалить эту транзакцию?</h2>
<p><strong>ID:</strong> {{ object.id }}</p>
<p><strong>Описание:</strong> {{ object.description }}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
</form>
<a href="{% url 'cashflow_list' %}">Отмена</a>
{% endblock %}
